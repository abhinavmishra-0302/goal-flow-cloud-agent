[project]
name = "goalflow-cloud-agent"
version = "2.0.0"
description = "GoalFlow v2 cloud agent: conversation + memory, generic Task Contract interpretation (LangGraph), HITL interrupt, and WebSocket hub between UI and on-device agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "websockets",
    "langgraph",
    "langgraph-checkpoint",
    # v3-M5: the checkpointer is SQLite-backed, so a goal paused at its approval
    # gate survives a cloud restart. Board goals span days; MemorySaver spans one
    # process.
    "langgraph-checkpoint-sqlite",
    "langchain-openai",
    "python-dotenv",
    "pydantic",
    # v11: the fish.audio TTS client. Present transitively already (langchain-openai
    # pulls it in), but declared because this repo now IMPORTS it directly — an
    # indirect dependency that a sibling could drop is not a dependency.
    "httpx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
